[workspace]
resolver = "3"
members = ["crates/imping-codegen", "crates/imping-build", "crates/codegen-fixture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["WoefulWolf"]
repository = "https://github.com/WoefulWolf/imping-codegen"
publish = false

[workspace.dependencies]
imping-ir = { git = "https://github.com/WoefulWolf/imping-ir" }
# Only codegen-fixture uses it, since the generated code depends on it.
imping-runtime = { git = "https://github.com/WoefulWolf/imping-runtime" }
imping-codegen = { path = "crates/imping-codegen" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
