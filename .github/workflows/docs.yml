# Builds the docs and publishes them to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    # The crates are Windows-first, so document the Windows view of them.
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: cargo doc --no-deps --all-features --lib --workspace --exclude codegen-fixture
      - run: Set-Content target/doc/index.html '<meta http-equiv="refresh" content="0; url=imping_codegen/index.html">'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
      - id: deploy
        uses: actions/deploy-pages@v5
